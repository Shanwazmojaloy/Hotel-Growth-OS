name: Deploy Hotel Growth OS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:

      # ✨ Install secure dependencies (npm ci)
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4.1
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd ./hotel-growth-os/client && \
          npm ci --cache .npm --prefer-offline || npm ci

      # 💥 Build & deploy frontend (Vercel)
      - name: Vercel deploy
        uses: @vercel/vercel-action@latest
        with:
          publish-dir: 'hotel-growth-os/client/.output'
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          repo-token: ${{ github.token }}

      # 💻 Link Supabase project and set up CLI for secure deployments
      - name: Set up Supabase CLI 🛠️
        uses: supabase/setup-cli@v0.1.5
        with:
          version: 1.3

      - name: Push database migrations to production 🌐
        run: |
          cd ./hotel-growth-os/backend && \
          npx supabase db push --project https://gvjxjsjwuweecilcqqhb.supabase.co/rls.json
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
