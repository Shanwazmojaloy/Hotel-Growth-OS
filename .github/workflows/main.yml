name: Deploy Hotel Growth OS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_PROJECT_ID: gvjxjsjwuweecilcqqhb

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js for Frontend
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./client
        run: npm ci --silent

      - name: Build frontend
        working-directory: ./client
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      # --- Supabase Backend Deployment Steps ---
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate Supabase credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "SUPABASE_ACCESS_TOKEN is not configured"
            exit 1
          }

          test -n "$SUPABASE_DB_PASSWORD" || {
            echo "SUPABASE_DB_PASSWORD is not configured"
            exit 1
          }

      - name: Validate Supabase project access
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          projects_file="$(mktemp)"

          if ! supabase projects list --output json > "$projects_file"; then
            echo "SUPABASE_ACCESS_TOKEN was rejected by Supabase."
            echo "Replace it with a Supabase Personal Access Token for a user who can access project $SUPABASE_PROJECT_ID."
            exit 1
          fi

          if ! grep -q "\"id\": \"$SUPABASE_PROJECT_ID\"" "$projects_file"; then
            echo "The authenticated Supabase account cannot access project $SUPABASE_PROJECT_ID."
            echo "Grant the token owner access to the project or organization, then retry."
            exit 1
          fi

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if ! supabase link \
              --project-ref "$SUPABASE_PROJECT_ID" \
              --password "$SUPABASE_DB_PASSWORD"; then
            echo "Supabase project linking failed. Verify SUPABASE_DB_PASSWORD matches project $SUPABASE_PROJECT_ID."
            exit 1
          fi

      - name: Push database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push

      - name: Deploy Supabase Edge Functions
        if: ${{ hashFiles('supabase/functions/**') != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"

      # --- Vercel Frontend Deployment ---
      - name: Validate Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN" || {
            echo "VERCEL_TOKEN is not configured"
            exit 1
          }

          test -n "$VERCEL_PROJECT_ID" || {
            echo "VERCEL_PROJECT_ID is not configured; set it as a GitHub variable or secret."
            exit 1
          }

          test -n "${{ vars.NEXT_PUBLIC_SUPABASE_URL }}" || {
            echo "NEXT_PUBLIC_SUPABASE_URL is not configured as a GitHub variable."
            exit 1
          }

          test -n "${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" || {
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY is not configured as a GitHub variable."
            exit 1
          }

      - name: Deploy frontend to Vercel (Production)
        working-directory: ./client
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npx --yes vercel@latest deploy \
            --prod \
            --yes \
            --token="$VERCEL_TOKEN" \
            --project="$VERCEL_PROJECT_ID" \
            --build-env NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            --build-env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
