name: Deploy Hotel Growth OS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_PROJECT_ID: gvjxjsjwuweecilcqqhb
      VERCEL_PROJECT_ID: prj_AIF7pH1Io1NES3XdbMAeBEdKj4eV
      VERCEL_ORG_ID: team_l1SAECyZJ9giIw4o2SGxjpqd

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js for Frontend
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hotel-growth-os/client/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./hotel-growth-os/client
        run: npm ci --silent

      - name: Build frontend
        working-directory: ./hotel-growth-os/client
        run: npm run build

      # --- Supabase Backend Deployment Steps ---
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 1.200.0
        env:
         GITHUB_TOKEN: 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
         SUPABASE_PROJECT_ID: gvjxjsjwuweecilcqphb
          
      - name: Link Supabase project
        working-directory: ./hotel-growth-os/backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Push database migrations
        working-directory: ./hotel-growth-os/backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push

      - name: Deploy Supabase Edge Functions
        working-directory: ./hotel-growth-os/backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"

      # --- Vercel Frontend Deployment ---
      - - name: Deploy frontend to Vercel (Production)
          run: npx vercel deploy --prod --yes
          env:
            VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
            VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
            VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
            NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      # --- START: CORRECTED VERCEL DEPLOYMENT BLOCK ---
      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v25 # Using the stable community action
        with:
          working-directory: ./hotel-growth-os/client
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod' # Pass --prod flag for production deployment

      # --- END: CORRECTED VERCEL DEPLOYMENT BLOCK ---
